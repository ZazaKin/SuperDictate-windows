# Builds and tests the Mac app on GitHub's Apple Silicon runners whenever the
# macos/ folder changes. The unsigned app is kept for a week as a download.
# macOS 26 with Xcode 26: the Liquid Glass capsule needs its SDK; the app still
# runs on macOS 14 and 15, with a painted glass instead.
name: macOS app

on:
  push:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --package-path macos

      - name: Build the app
        run: bash macos/scripts/build-app.sh "$RUNNER_TEMP/SuperDictate.app"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperDictate-macOS
          path: ${{ runner.temp }}/SuperDictate-macOS.zip
          retention-days: 7

      # Pictures of the main screens, light and dark, drawn by the app itself.
      - name: Snapshots
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/SuperDictate.app/Contents/MacOS/SuperDictate" --snapshot "$RUNNER_TEMP/snapshots"
          ls -l "$RUNNER_TEMP/snapshots"

      # Glass is drawn by the window server, so the app shows it in a window and
      # this photographs the screen. Without screen recording access the picture
      # is skipped, never the build.
      - name: Liquid Glass showcase
        timeout-minutes: 2
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/SuperDictate.app/Contents/MacOS/SuperDictate" --showcase &
          sleep 8
          screencapture -x -R0,0,960,420 "$RUNNER_TEMP/snapshots/capsule-liquid-glass.png"
          kill %1

      - uses: actions/upload-artifact@v4
        with:
          name: SuperDictate-screenshots
          path: ${{ runner.temp }}/snapshots
          retention-days: 7
