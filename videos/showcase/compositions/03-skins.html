        @font-face {

        #skins-view {

          perspective-origin: 1270px 540px;
          -webkit-mask-image: linear-gradient(180deg, transparent 6%, #000 36%, #000 64%, transparent 94%);
          mask-image: linear-gradient(180deg, transparent 6%, #000 36%, #000 64%, transparent 94%);

        #skins-drum video {

        #skins-title {
          position: absolute;
          left: 115px;

          width: 700px;
          font-size: 150px;
          font-weight: 600;
          line-height: 0.98;
          letter-spacing: -0.045em;
        }
        #skins-sub {
          position: absolute;
          left: 118px;
          top: 480px;
          width: 620px;
          font-size: 40px;
          line-height: 1.3;
          color: #9fb0c2;
        }
        #skins-names {
          position: absolute;
          left: 118px;
          top: 640px;

        }
        #skins-names span {
          position: absolute;
          left: 0;

        }
        #skins-names b {
          font-weight: 600;
          color: #6ab2f2;
        }
        #skins-names em {
          font-style: normal;
          color: #8395a7;
          margin-left: 14px;
        }
      </style>
      <div data-hf-id="hf-z1f4" id="skins-root" data-composition-id="skins" data-width="1920" data-height="1080">
        <svg data-hf-id="hf-p3r6" width="0" height="0" aria-hidden="true" style="position: absolute">
          <filter data-hf-id="hf-poli" id="skins-whip" x="-30%" y="0" width="160%" height="100%"><fegaussianblur data-hf-id="hf-o0kp" id="skins-whip-blur" stdDeviation="0 0" /></filter>
        </svg>
        <div data-hf-id="hf-n1hf" id="skins-stage" data-layout-allow-overflow="">
          <div data-hf-id="hf-gj2k" id="skins-view" data-layout-allow-overflow=""><div data-hf-id="hf-hloj" id="skins-drum" data-layout-allow-overflow=""><div class="skin" style="transform: rotateX(0deg) translateZ(300px)"><video id="skins-liquid" class="clip" src="assets/skins/liquid.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="1"></video></div><div class="skin" style="transform: rotateX(36deg) translateZ(300px)"><video id="skins-bloom" class="clip" src="assets/skins/bloom.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="2"></video></div><div class="skin" style="transform: rotateX(72deg) translateZ(300px)"><video id="skins-eclipse" class="clip" src="assets/skins/eclipse.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="3"></video></div><div class="skin" style="transform: rotateX(108deg) translateZ(300px)"><video id="skins-chrome" class="clip" src="assets/skins/chrome.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="4"></video></div><div class="skin" style="transform: rotateX(144deg) translateZ(300px)"><video id="skins-hive" class="clip" src="assets/skins/hive.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="5"></video></div><div class="skin" style="transform: rotateX(180deg) translateZ(300px)"><video id="skins-halftone" class="clip" src="assets/skins/halftone.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="6"></video></div><div class="skin" style="transform: rotateX(216deg) translateZ(300px)"><video id="skins-mosaic" class="clip" src="assets/skins/mosaic.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="7"></video></div><div class="skin" style="transform: rotateX(252deg) translateZ(300px)"><video id="skins-mesa" class="clip" src="assets/skins/mesa.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="8"></video></div><div class="skin" style="transform: rotateX(288deg) translateZ(300px)"><video id="skins-aurora" class="clip" src="assets/skins/aurora.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="9"></video></div><div class="skin" style="transform: rotateX(324deg) translateZ(300px)"><video id="skins-neon" class="clip" src="assets/skins/neon.webm" muted playsinline data-start="0" data-duration="5.85" data-track-index="10"></video></div></div></div>
          <div data-hf-id="hf-bxgw" id="skins-title">15 skins.</div>
          <div data-hf-id="hf-0veq" id="skins-sub">Any color, any size, anywhere on screen.</div>
          <div data-hf-id="hf-pwge" id="skins-names"></div>
        </div>
      </div>
      <script>
        gsap.registerPlugin(CustomEase);
        CustomEase.create("rise", "0.32,0.72,0,1"); // The app's page-rise easing (DESIGN.md).
        const tl = gsap.timeline({ paused: true });

        // The registry's per-word-rise landing: decelerates, then glides the last few pixels in.
        function land(p) {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          const s = 0.78, r = 0.07, k = ((1 - r) / s) * 0.5;
          if (p < s) {
            const x = p / s, i = 1 - x;
            return (1 - r) * (0.5 * (1 - i * i * i) + 0.5 * x);
          }
          const u = (p - s) / (1 - s), b = k * (1 - s), c = 3 * r - 2 * b, d = b - 2 * r;
          return 1 - r + b * u + c * u * u + d * u * u * u;
        }
        function words(el) {
          const out = [];
          [...el.childNodes].forEach((node) => {
            node.textContent.split(/(\s+)/).forEach((part) => {
              if (!part) return;
              if (/^\s+$/.test(part)) return el.insertBefore(document.createTextNode(" "), node);
              const word = document.createElement("span");
              word.className = "w";
              word.textContent = part;
              el.insertBefore(word, node);
              out.push(word);
            });
            el.removeChild(node);
          });
          return out;
        }
        function rise(el, at, stagger) {
          tl.fromTo(words(el), { opacity: 0, y: 60, filter: "blur(14px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.74, ease: land, stagger: stagger ?? 0.08 }, at);
        }

        // Ten of the fifteen, the liveliest, in the order of the wheel.
        const skins = ["Liquid Glass", "Bloom", "Eclipse", "Chrome", "Hive", "Halftone", "Mosaic", "Mesa", "Aurora", "Neon"];
        const drum = document.getElementById("skins-drum");
        const names = document.getElementById("skins-names");
        const clips = drum.querySelectorAll("video");
        const angle = 360 / skins.length;
        skins.forEach((name) => {
          const label = document.createElement("span");
          label.innerHTML = "<b>" + name + "</b>";
          names.appendChild(label);
        });

        // Zoom-through in: the shot arrives out of the last one's push, out of focus.
        tl.fromTo("#skins-stage", { transformOrigin: "960px 540px", scale: 1.45, opacity: 0, filter: "blur(22px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.65, ease: "power3.out" }, 0);
        tl.set("#skins-stage", { filter: "none" }, 0.66);

        // The wheel, as a function of time: it spins in, then rolls on slowly, easing into each skin
        // and out again. Skins away from the front fall out of focus and dim, as on a lens.
        function turn(t) {
          if (t < 0.8) return 48 * Math.pow(1 - t / 0.8, 3);
          let at = 0;
          for (let index = 1; index < skins.length; index++) {
            const start = 0.95 + (index - 1) * 0.5;
            if (t <= start) break;
            const p = Math.min((t - start) / 0.42, 1);
            at = -(index - 1 + (0.5 - 0.5 * Math.cos(Math.PI * p))) * angle;
          }
          return at;
        }
        const wheel = { t: 0 };
        function roll() {
          const rotation = turn(wheel.t);
          gsap.set(drum, { rotationX: rotation });
          clips.forEach((clip, index) => {
            const away = Math.abs(((index * angle + rotation) % 360 + 540) % 360 - 180) / angle;
            clip.style.filter = "blur(" + (Math.min(away, 2.5) * 3.4).toFixed(2) + "px) brightness(" + (1 - Math.min(away, 2) * 0.2).toFixed(3) + ")";
          });
        }
        roll();
        tl.fromTo(wheel, { t: 0 }, { t: 5.85, duration: 5.85, ease: "none", onUpdate: roll }, 0);
        const labels = names.querySelectorAll("span");
        tl.set(labels[0], { opacity: 1 }, 0.45);
        for (let index = 1; index < skins.length; index++) {
          const at = 0.95 + (index - 1) * 0.5;
          tl.set(labels[index - 1], { opacity: 0 }, at + 0.21);
          tl.set(labels[index], { opacity: 1 }, at + 0.21);
        }
        rise(document.getElementById("skins-title"), 0.3);
        rise(document.getElementById("skins-sub"), 0.6, 0.04);
        tl.fromTo("#skins-names", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "rise" }, 0.45);

        // Whip pan out.
        const whipBlur = document.getElementById("skins-whip-blur");
        const whip = { v: 0 };
        const writeWhip = () => whipBlur.setAttribute("stdDeviation", whip.v + " 0");
        tl.set("#skins-stage", { filter: "url(#skins-whip)" }, 5.4);
        tl.to("#skins-stage", { x: -1920, duration: 0.45, ease: "power3.in" }, 5.4);
        tl.fromTo(whip, { v: 0 }, { v: 70, duration: 0.45, ease: "power3.in", onUpdate: writeWhip, immediateRender: false }, 5.4);
        window.__timelines["skins"] = tl;
      </script>
    </template>
  </body>
</html>
