<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="dictate-template">
      <style>
        /* The app's own font, Segoe UI, as installed with Windows (nothing is shipped). */
        @font-face {
          font-family: "SD Segoe";
          src: local("Segoe UI"), local("SegoeUI");
          font-weight: 400;
        }
        @font-face {
          font-family: "SD Segoe";
          src: local("Segoe UI Semibold"), local("SegoeUI-Semibold");
          font-weight: 600;
        }
        @font-face {
          font-family: "SD Segoe";
          src: local("Segoe UI Bold"), local("SegoeUI-Bold");
          font-weight: 700;
        }
        [data-composition-id="dictate"] {
          position: absolute;
          inset: 0;
          font-family: "SD Segoe", sans-serif;
          color: #f5f5f5;
        }
        [data-composition-id="dictate"] .w {
          display: inline-block;
        }
        [data-composition-id="dictate"] .em {
          color: #6ab2f2;
        }
        #dictate-stage,
        #dictate-cam,
        #dictate-world {
          position: absolute;
          inset: 0;
        }
        /* The camera: one lens over the whole desk, so the capsule and the page move as one. */
        #dictate-cam {
          perspective: 1800px;
          perspective-origin: 960px 540px;
        }
        #dictate-world {
          transform-style: preserve-3d;
        }
        /* The document the words land in: a stand-in for any app. */
        #dictate-doc {
          position: absolute;
          left: 326px;
          top: 250px;
          width: 1268px;
          height: 500px;
          border-radius: 22px;
          background: #fbfbfc;
          color: #1f232b;
          box-shadow: 0 40px 90px rgba(0, 0, 0, 0.5);
          overflow: hidden;
        }
        [data-composition-id="dictate"] .bar {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 16px 24px;
          background: #eceef2;
        }
        [data-composition-id="dictate"] .bar i {
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #c9cdd4;
        }
        [data-composition-id="dictate"] .bar span {
          margin-left: 14px;
          font-size: 22px;
          color: #5b616b;
        }
        [data-composition-id="dictate"] .body {
          padding: 44px 58px;
          font-size: 38px;
          line-height: 1.6;
        }
        [data-composition-id="dictate"] .line {
          position: relative;
        }
        [data-composition-id="dictate"] .cursor {
          display: inline-block;
          width: 3px;
          height: 44px;
          margin-left: 2px;
          vertical-align: -8px;
          background: #1f232b;
        }
        #dictate-cursor-start {
          position: absolute;
          left: 0;
          top: 10px;
        }
        #dictate-typed,
        #dictate-cursor-end {
          opacity: 0;
        }
        #dictate-typed {
          border-radius: 6px;
        }
        /* The capsule, drawn by the app: at the top of the "screen", above the page. */
        #dictate-cap {
          position: absolute;
          left: 320px;
          top: 52px;
          width: 1280px;
          height: 200px;
        }
        #dictate-cap video {
          position: absolute;
          inset: 0;
          width: 1280px;
          height: 200px;
        }
        #dictate-speak {
          position: absolute;
          left: 0;
          right: 0;
          top: 730px;
          text-align: center;
          font-size: 190px;
          font-weight: 600;
          line-height: 1;
          letter-spacing: -0.04em;
        }
        #dictate-lands {
          position: absolute;
          left: 115px;
          bottom: 76px;
          width: 1150px;
          font-size: 92px;
          font-weight: 600;
          line-height: 1.04;
          letter-spacing: -0.035em;
        }
      </style>
      <div data-hf-id="hf-d5hg" id="dictate-root" data-composition-id="dictate" data-width="1920" data-height="1080">
        <svg data-hf-id="hf-p3r6" width="0" height="0" aria-hidden="true" style="position: absolute">
          <filter data-hf-id="hf-6tok" id="dictate-whip" x="-30%" y="0" width="160%" height="100%"><fegaussianblur data-hf-id="hf-jy0v" id="dictate-whip-blur" stdDeviation="0 0" /></filter>
        </svg>
        <div data-hf-id="hf-gd7l" id="dictate-stage" data-layout-allow-overflow="">
          <div data-hf-id="hf-pfz9" id="dictate-cam">
            <div data-hf-id="hf-whjb" id="dictate-world" data-layout-allow-overflow="">
              <div data-hf-id="hf-bu56" id="dictate-doc">
                <div data-hf-id="hf-ufsv" class="bar"><i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i><span data-hf-id="hf-yzq6">Notes</span></div>
                <div data-hf-id="hf-1tw3" class="body" id="dictate-body">
                  <div data-hf-id="hf-2wdo">Hi team,</div>
                  <div data-hf-id="hf-np12" class="line"><span data-hf-id="hf-564x" class="cursor" id="dictate-cursor-start"></span><span data-hf-id="hf-boqw" id="dictate-typed">Move the design review to Thursday at three, and send the new mockups tonight</span><span data-hf-id="hf-238q" class="cursor" id="dictate-cursor-end"></span></div>
                </div>
              </div>
              <div data-hf-id="hf-qzio" id="dictate-cap"><video data-hf-id="hf-4qj3" id="dictate-video" class="clip" src="assets/capsule-dictate.webm" muted playsinline data-start="0" data-duration="5.2" data-track-index="1"></video></div>
            </div>
          </div>
          <div data-hf-id="hf-jlue" id="dictate-speak">Speak.</div>
          <div data-hf-id="hf-jdnh" id="dictate-lands">Your words appear <em data-hf-id="hf-yfkr">where you type.</em></div>
        </div>
      </div>
      <script>
        gsap.registerPlugin(CustomEase);
        CustomEase.create("rise", "0.32,0.72,0,1"); // The app's page-rise easing (DESIGN.md).
        const tl = gsap.timeline({ paused: true });

        // The registry's per-word-rise landing: decelerates, then glides the last few pixels in.
        function land(p) {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          const s = 0.78, r = 0.07, k = ((1 - r) / s) * 0.5;
          if (p < s) {
            const x = p / s, i = 1 - x;
            return (1 - r) * (0.5 * (1 - i * i * i) + 0.5 * x);
          }
          const u = (p - s) / (1 - s), b = k * (1 - s), c = 3 * r - 2 * b, d = b - 2 * r;
          return 1 - r + b * u + c * u * u + d * u * u * u;
        }
        // Each word its own span (an <em> keeps its accent), so words can rise one after another.
        function words(el) {
          const out = [];
          [...el.childNodes].forEach((node) => {
            node.textContent.split(/(\s+)/).forEach((part) => {
              if (!part) return;
              if (/^\s+$/.test(part)) return el.insertBefore(document.createTextNode(" "), node);
              const word = document.createElement("span");
              word.className = node.nodeType === 1 ? "w em" : "w";
              word.textContent = part;
              el.insertBefore(word, node);
              out.push(word);
            });
            el.removeChild(node);
          });
          return out;
        }
        function rise(el, at, stagger) {
          tl.fromTo(words(el), { opacity: 0, y: 70, filter: "blur(16px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.74, ease: land, stagger: stagger ?? 0.07 }, at);
        }
        function leave(el, at) {
          tl.to(el.querySelectorAll(".w"), { opacity: 0, y: -40, filter: "blur(12px)", duration: 0.36, ease: "power2.in", stagger: 0.03 }, at);
        }

        // The camera, the only thing that moves the desk: a close-up on the capsule, settling out
        // of a tilt, then one pull-back to the whole desk. Its zoom, 30 values a second, comes from
        // the capsule's own width in the app's frames: it eases out a little ahead of each widening,
        // so the capsule grows on screen and never leaves the frame. Then it breathes in.
        const camera = {"scale":[2.3349,2.3317,2.3282,2.3244,2.3203,2.3159,2.3113,2.3065,2.3015,2.2963,2.291,2.2857,2.2803,2.2748,2.2694,2.264,2.2586,2.2532,2.248,2.2428,2.2377,2.2328,2.2279,2.2232,2.2186,2.2142,2.2099,2.2058,2.2017,2.1979,2.1941,2.1905,2.187,2.1837,2.1804,2.1772,2.1741,2.1711,2.1682,2.1653,2.1624,2.1595,2.1567,2.1538,2.1509,2.1479,2.1448,2.1417,2.1384,2.135,2.1314,2.1277,2.1237,2.1195,2.115,2.1102,2.1051,2.0997,2.094,2.0878,2.0813,2.0743,2.0669,2.059,2.0507,2.0419,2.0325,2.0228,2.0125,2.0017,1.9905,1.9788,1.9666,1.954,1.9409,1.9275,1.9137,1.8995,1.8849,1.87,1.8548,1.8394,1.8236,1.8076,1.7913,1.7748,1.758,1.741,1.7238,1.7064,1.6888,1.6711,1.6531,1.6351,1.6169,1.5694,1.537,1.5199,1.5087,1.5032,1.5005,1.5005,1.4709,1.4526,1.4399,1.4323,1.4289,1.4149,1.401,1.3871,1.3733,1.3596,1.346,1.3325,1.3192,1.3062,1.2933,1.2808,1.2686,1.2568,1.2454,1.2345,1.224,1.2141,1.2048,1.1961,1.1881,1.1807,1.174,1.168,1.1627,1.1581,1.1543,1.1512,1.1489,1.1474,1.0],"y":[388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388,388.0,388.0,387.9,387.8,387.4,386.6,385.2,383.0,379.8,375.2,368.9,360.5,349.7,335.9,318.6,297.4,271.7,240.8,204.1,164.8,131.1,102.9,79.5,60.3,44.8,32.5,23.0,15.7,10.3,6.4,3.8,2.0,1.0,0.4,0.1,0.0,0.0,0.0,0]};
        const world = document.getElementById("dictate-world");
        const lens = { t: 0 };
        function frameCamera() {
          const t = lens.t;
          let scale = 1 + 0.04 * (0.5 - 0.5 * Math.cos(Math.PI * Math.min(Math.max((t - 4.55) / 1.85, 0), 1)));
          let y = 0;
          if (t < 4.55) {
            const f = Math.min(t * 30, camera.scale.length - 1.001);
            const i = Math.floor(f), k = f - i;
            scale = camera.scale[i] + (camera.scale[i + 1] - camera.scale[i]) * k;
            y = camera.y[i] + (camera.y[i + 1] - camera.y[i]) * k;
          }
          gsap.set(world, { transformOrigin: "960px 152px", scale: scale, y: y, rotationX: 18 * Math.pow(1 - Math.min(t / 1.4, 1), 3) });
        }
        frameCamera();
        tl.fromTo(lens, { t: 0 }, { t: 6.4, duration: 6.4, ease: "none", onUpdate: frameCamera }, 0);
        tl.set("#dictate-doc", { filter: "blur(18px)", opacity: 0.12 }, 0); // Out of focus and dim: just a shape behind the words.
        tl.set("#dictate-body", { opacity: 0 }, 0); // Its words come with the focus.
        tl.fromTo("#dictate-cap", { y: -46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "rise" }, 0.05);
        rise(document.getElementById("dictate-speak"), 0.5);
        leave(document.getElementById("dictate-speak"), 3.0);

        // As the camera pulls back, the page comes into focus.
        tl.to("#dictate-doc", { filter: "blur(0px)", opacity: 1, duration: 1.0, ease: "power2.out" }, 3.45);
        tl.to("#dictate-body", { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.95);

        // The words land at the cursor, pasted at once as the app types them, with a brief highlight.
        tl.fromTo("#dictate-cursor-start", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 7, yoyo: true, repeatDelay: 0.5 }, 0.5);
        tl.set("#dictate-cursor-start", { opacity: 0 }, 4.6);
        tl.set(["#dictate-typed", "#dictate-cursor-end"], { opacity: 1 }, 4.6);
        tl.fromTo("#dictate-typed", { backgroundColor: "rgba(50, 114, 170, 0.28)" }, { backgroundColor: "rgba(50, 114, 170, 0)", duration: 0.9, ease: "power2.out" }, 4.6);
        tl.fromTo("#dictate-cursor-end", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 2, yoyo: true, repeatDelay: 0.5, immediateRender: false }, 5.1);
        // The capsule leaves as the app's does once the words are typed.
        tl.to("#dictate-cap", { y: -46, opacity: 0, duration: 0.4, ease: "power2.in" }, 4.8);
        rise(document.getElementById("dictate-lands"), 4.7, 0.06);

        // Whip pan out: the whole shot streaks left, blur peaking at the cut.
        const whipBlur = document.getElementById("dictate-whip-blur");
        const whip = { v: 0 };
        const writeWhip = () => whipBlur.setAttribute("stdDeviation", whip.v + " 0");
        tl.set("#dictate-stage", { filter: "url(#dictate-whip)" }, 6.4);
        tl.to("#dictate-stage", { x: -1920, duration: 0.45, ease: "power3.in" }, 6.4);
        tl.fromTo(whip, { v: 0 }, { v: 70, duration: 0.45, ease: "power3.in", onUpdate: writeWhip, immediateRender: false }, 6.4);
        window.__timelines["dictate"] = tl;
      </script>
    </template>
  </body>
</html>
