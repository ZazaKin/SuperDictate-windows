<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e1621;
      }
      /* The field: Telegram's night blue from DESIGN.md, with two pools of the app's blue drifting in it. */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1621;
      }
      .pool {
        position: absolute;
        border-radius: 50%;
      }
      #pool-a {
        left: -260px;
        top: -380px;
        width: 1500px;
        height: 1100px;
        background: radial-gradient(closest-side, rgba(50, 114, 170, 0.42), rgba(50, 114, 170, 0));
      }
      #pool-b {
        left: 900px;
        top: 380px;
        width: 1400px;
        height: 1000px;
        background: radial-gradient(closest-side, rgba(106, 178, 242, 0.16), rgba(106, 178, 242, 0));
      }
      /* The registry's vignette, over everything, pulling the eye to the middle. */
      #hf-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 90;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(4, 8, 14, 0.6) 100%);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-wx9m" id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <div data-hf-id="hf-cdq5" class="pool" id="pool-a" data-layout-allow-overflow=""></div>
      <div data-hf-id="hf-gbu6" class="pool" id="pool-b" data-layout-allow-overflow=""></div>

      <div data-hf-id="hf-032h" id="el-dictate" data-composition-id="dictate" data-composition-src="compositions/01-dictate.html" data-start="0" data-duration="6.85" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-c6w4" id="el-glass" data-composition-id="glass" data-composition-src="compositions/02-glass.html" data-start="6.85" data-duration="3.75" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-jih0" id="el-skins" data-composition-id="skins" data-composition-src="compositions/03-skins.html" data-start="10.45" data-duration="5.85" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ptht" id="el-languages" data-composition-id="languages" data-composition-src="compositions/04-languages.html" data-start="16.3" data-duration="3.9" data-track-index="4" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-c7e0" id="el-close" data-composition-id="close" data-composition-src="compositions/05-close.html" data-start="19.7" data-duration="4.3" data-track-index="5" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-t2aa" id="hf-vignette"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // The light pools drift slowly the whole film, out of step with each other.
      tl.fromTo("#pool-a", { x: 0, y: 0, scale: 1 }, { x: 260, y: 120, scale: 1.12, duration: 12, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#pool-b", { x: 0, y: 0, scale: 1.1 }, { x: -320, y: -160, scale: 0.95, duration: 8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
