; SuperDictate release settings. Type your answers at the end of each line,
; after "=", save the file and double-click build-release.cmd. The script checks
; the answers and fills them in where they belong: the version into
; SuperDictate.csproj, the repository address into the docs, the certificate
; thumbprint into release-signing.sha1, the donation options into the last
; section of the README and GitHub's Sponsor button. This file is also embedded
; in the app: the links and donation options on its Support page come from here.
;
; Lines starting with ";" are comments.

[release]

; Release number: three numbers separated by dots. Raise it for every new
; release and add notes as docs\releases\<number>.md.
version = 1.3.1

; The GitHub repository the releases are published in.
repository = https://github.com/ZazaKin/SuperDictate-windows

; Thumbprint (40 characters) of the code signing certificate. Empty means an
; unsigned build, and Windows warns users. Once used, don't change it: the
; SmartScreen reputation is tied to the certificate.
signing_thumbprint =

[donations]

; Ways to support you, in display order: in the app (Settings > Support) and in
; the last section of the README on GitHub.
;
; Format:  Name | note under the name = link or wallet address
;
; Put the link or address at the end of the line, after "=". A link (https://...)
; opens in the browser; a wallet address is copied. A line without an answer is
; hidden. Add your own lines for other networks (TON, say) or a page of yours
; with all options. How to set each one up: docs\donations-guide.md.
Ko-fi | Card or PayPal = https://ko-fi.com/zazakin
Buy Me a Coffee | Card = https://buymeacoffee.com/zazakin
USDT / USDC (EVM) | Same address on Ethereum, BNB Chain, Polygon, Arbitrum, Base = 0xEB571a20373a439f9c97EAA203b6c86B927B3482
USDT (TRC20) | TRON network only = TAUv9GctsU5hCbd5K48otaZBt6H5fLULeb
Solana | USDC or SOL on Solana only = 22qrMU3Jk5rrace5sWS88pqo1AoTftmfHNe4QaNs8nTQ
Bitcoin | Bitcoin network only = bc1q28r8zrnug2jhkn4p33836flhkp78dz6neghhe4
